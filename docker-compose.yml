services:
  api:
    build: .
    container_name: fastapi_app
    command: uv run fastapi run app/main.py --host 0.0.0.0 --port 8000
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      N8N_BASE_URL: http://n8n:5678
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A app.tasks.celery.celery_app worker --loglevel=info
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

volumes:
  postgres_data:
  n8n_data:
